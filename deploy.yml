version: "2.0"

services:
  web:
    image: ghcr.io/toxmon/penn-conf-companion:sha-477c7b2
    expose:
      - port: 80
        as: 80
        to:
          - global: true
        http_options:
          max_body_size: 1048576
          read_timeout: 30000
          send_timeout: 30000

profiles:
  compute:
    web:
      resources:
        cpu:
          units: 0.1
        memory:
          size: 128Mi
        storage:
          size: 256Mi

  placement:
    mainstream:
      pricing:
        web:
          denom: uact
          amount: 500

deployment:
  web:
    mainstream:
      profile: web
      count: 1
